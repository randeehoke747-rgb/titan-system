apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-control-plane
  namespace: titan
spec:
  replicas: 1

  selector:
    matchLabels:
      app: titan-control-plane

  template:
    metadata:
      labels:
        app: titan-control-plane

    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: titan-control-plane
          image: titan-system:local

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: RUST_LOG
              value: "info"

            - name: NODE_ROLE
              value: "control-plane"

            - name: SAFE_WALLET_ADDRESS
              value: "SAFE-WALLET-UNCONFIGURED"

            - name: MINIMUM_ACTIVE_AGENTS
              value: "2"

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
